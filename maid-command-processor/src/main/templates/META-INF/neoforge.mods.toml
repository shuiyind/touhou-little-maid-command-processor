# This is an example neoforge.mods.toml file.
# The overall format is standard TOML format, v0.5.0.

modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"

# A URL to refer people to when problems occur with this mod
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/"

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
authors="${mod_authors}"
modAuthors="Maid Command Processor Team"

# The description text for the mod (multi line!) (#mandatory)
description='''
Maid Command Processor - A companion mod for Touhou Little Maid
Enables maids to execute Minecraft commands through AI dialogue system.
Players can interact with maids via chat (press T) and the AI will execute commands,
grant items, or perform actions based on natural language understanding.

Features:
- Permission-based command execution (whitelist/admin)
- Compatible with vanilla Minecraft commands
- Compatible with Little Maid mod commands
- Extensible command compatibility for modpacks
- AI dialogue integration for natural language command execution
'''

# The [[mixins]] block allows you to declare your mixin config to FML
#[[mixins]]
#config="${mod_id}.mixins.json"

# The [[accessTransformers]] block allows you to declare where your AT file is.
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

# Dependencies
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Little Maid mod is an optional dependency
[[dependencies.${mod_id}]]
    modId="littlemaid"
    type="optional"
    versionRange="[1.0,)"
    ordering="NONE"
    side="BOTH"
